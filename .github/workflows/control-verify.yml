name: JUICE Control verification

on:
  push:
    paths:
      - ".github/workflows/control-verify.yml"
      - ".gitignore"
      - "CONTROL/**"
  pull_request:
    paths:
      - ".github/workflows/control-verify.yml"
      - ".gitignore"
      - "CONTROL/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Make launchers executable
        run: chmod +x CONTROL/start.command CONTROL/server.py CONTROL/scripts/*

      - name: Run six-pass verification
        env:
          JUICE_DATA_ROOT: ${{ runner.temp }}/JUICE_DATA
        run: bash CONTROL/scripts/verify.sh
